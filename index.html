<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Web Shell Core</title>
    <style>
        /* Modern Hardware-Accelerated Design Variables */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0f0f11; color: #e4e4e7; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Premium Chromium-Style Top Address Toolbar */
        .toolbar { background: #1f1f23; padding: 12px 18px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #2e2e33; }
        .nav-group { display: flex; gap: 10px; }
        .nav-btn { background: none; border: none; color: #a1a1aa; font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: 0.2s; }
        .nav-btn:hover { background: #2e2e33; color: #fff; }
        
        /* Glassmorphism Flat Omnibox Address Box Bar */
        .omnibox { flex: 1; background: #2e2e33; border: 1px solid #3f3f46; padding: 7px 16px; border-radius: 20px; color: #fff; font-size: 14px; outline: none; transition: 0.2s; }
        .omnibox:focus { border-color: #6366f1; background: #252529; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .action-btn { background: #6366f1; color: white; border: none; padding: 7px 18px; border-radius: 20px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background: #4f46e5; }

        /* App Layout Container Layer Spaces */
        .view-frame { flex: 1; display: flex; justify-content: center; align-items: center; background: #141416; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #ffffff; display: none; }

        /* Secure Client Gateway Dialog Card */
        .auth-card { background: #1f1f23; border: 1px solid #2e2e33; padding: 35px; border-radius: 12px; width: 380px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; z-index: 10; }
        .auth-card h2 { margin-bottom: 24px; font-weight: 600; color: #fff; letter-spacing: -0.5px; }
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; font-size: 11px; color: #a1a1aa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }
        .input-field { width: 100%; background: #2e2e33; border: 1px solid #3f3f46; padding: 10px 12px; border-radius: 6px; color: white; outline: none; font-size: 14px; }
        .input-field:focus { border-color: #6366f1; }
        .btn-stack { display: flex; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Flat Navigation Toolbar Frame -->
    <div class="toolbar">
        <div class="nav-group">
            <button class="nav-btn" onclick="document.getElementById('webViewport').contentWindow.history.back()">‹</button>
            <button class="nav-btn" onclick="document.getElementById('webViewport').contentWindow.history.forward()">›</button>
            <button class="nav-btn" onclick="document.getElementById('webViewport').src = document.getElementById('webViewport').src">⟳</button>
        </div>
        <input type="text" class="omnibox" id="urlInput" value="https://example.com" placeholder="Search parameters or entry web address...">
        <button class="action-btn" onclick="executeNavigation()">Navigate</button>
    </div>

    <!-- Active App Core Viewport Panel -->
    <div class="view-frame" id="mainPane">
        
        <!-- Interactive Verification Box Form -->
        <div class="auth-card" id="authBox">
            <h2>Secure Sign In</h2>
            <div class="input-group">
                <label>User Identity Parameter</label>
                <input type="text" class="input-field" id="uName" placeholder="Enter username...">
            </div>
            <div class="input-group">
                <label>Security Keyphrase Key</label>
                <input type="password" class="input-field" id="pWord" placeholder="Enter password...">
            </div>
            <div class="btn-stack">
                <button class="action-btn" style="flex: 1;" onclick="validateSession()">Authenticate</button>
                <button class="action-btn" style="flex: 1; background: #3f3f46;" onclick="registerAccount()">Register</button>
            </div>
        </div>

        <!-- HTML5 Real Rendering Viewport -->
        <iframe id="webViewport" src=""></iframe>
    </div>

    <script>
        // Pre-configure localized admin safety account profile baseline metrics
        if(!localStorage.getItem("user_admin")) {
            localStorage.setItem("user_admin", "password");
        }

        function validateSession() {
            const user = document.getElementById('uName').value.trim();
            const pass = document.getElementById('pWord').value.trim();
            
            if(user === "" || pass === "") {
                alert("Fields cannot remain empty parameters.");
                return;
            }

            // Look up verification indexes directly inside internal persistence strings
            const savedPassword = localStorage.getItem("user_" + user);
            if(savedPassword && savedPassword === pass) {
                document.getElementById('authBox').style.display = "none";
                const iframe = document.getElementById('webViewport');
                iframe.style.display = "block";
                iframe.src = "https://example.com";
            } else {
                alert("Authentication Failure. Invalid identity profile variables.");
            }
        }

        function registerAccount() {
            const user = document.getElementById('uName').value.trim();
            const pass = document.getElementById('pWord').value.trim();

            if(user.length < 3 || pass.length < 3) {
                alert("Metrics credentials parameters must be at least 3 characters long.");
                return;
            }

            if(localStorage.getItem("user_" + user)) {
                alert("Account token mapping instance already exists in local database.");
                return;
            }

            // Dynamic entry insertion straight into web database memory allocations
            localStorage.setItem("user_" + user, pass);
            alert("Account provisioned securely! You can now use Authenticate.");
        }

        function executeNavigation() {
            let target = document.getElementById('urlInput').value.trim();
            const iframe = document.getElementById('webViewport');

            if(iframe.style.display !== "block") {
                alert("Please authenticate using the secure layout panel configuration first.");
                return;
            }

            if(!target.startsWith('http://') && !target.startsWith('https://')) {
                target = 'https://' + target;
            }
            
            iframe.src = target;
        }
    </script>
</body>
</html>
